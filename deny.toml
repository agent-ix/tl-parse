[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tl-syntax is not published to a registry, so it resolves by exact git
# revision. The pin is 18850985fe124e4b3254bd9b9f7ef4c1fb4e1cf1, the
# exact reviewed commit in tl-syntax PR #94. It is not a moving branch head;
# integration waits for that dependency PR to merge.
# The earlier form of this exception was scoped to
# "until tl-syntax PR #6 merges or 2026-09-07"; that merge has happened (as
# PR #10, which superseded #6), so the expiry no longer applies. AA-001 still
# blocks source release while tl-syntax
# has no registry release.
allow-git = ["https://github.com/agent-ix/tl-syntax.git"]
