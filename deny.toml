[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# tl-syntax is not published to a registry, so it resolves from git.
allow-git = ["https://github.com/agent-ix/tl-syntax.git", "https://github.com/agent-ix/ix-cli-kit"]

# The shared CLI utility dependency has its own AGPL license.
[[licenses.exceptions]]
name = "ix-cli-kit"
version = "=0.1.0"
allow = ["AGPL-3.0-or-later"]
