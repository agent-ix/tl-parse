[package]
name = "tl-parse-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tl-parse = { path = ".." }

[workspace]

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clean_ascii_v2"
path = "fuzz_targets/clean_ascii_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unbounded_parse_roundtrip"
path = "fuzz_targets/unbounded_parse_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clean_ascii_v3"
path = "fuzz_targets/clean_ascii_v3.rs"
test = false
doc = false
bench = false
