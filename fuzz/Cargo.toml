[package]
name = "tl-parse-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
tl-parse = { path = ".." }

# UNBUILT-PIN: the fuzz package is its own workspace, so it repeats the root
# patch; remove both when the merged tl-syntax rev is pinned.
[patch."https://github.com/agent-ix/tl-syntax.git"]
tl-syntax = { path = "../../TL-code-tl-syntax" }

[workspace]

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clean_ascii_v2"
path = "fuzz_targets/clean_ascii_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unbounded_parse_roundtrip"
path = "fuzz_targets/unbounded_parse_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clean_ascii_v3"
path = "fuzz_targets/clean_ascii_v3.rs"
test = false
doc = false
bench = false

[[bin]]
name = "numeric_v5_roundtrip"
path = "fuzz_targets/numeric_v5_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clean_ascii_v6"
path = "fuzz_targets/clean_ascii_v6.rs"
test = false
doc = false
bench = false
