name: CI

on:
  workflow_dispatch:
    inputs:
      tool_profile:
        description: Exact reviewed tools.lock profile (runner profile must be committed first)
        required: true
        default: peter-linux-x86_64-v1

jobs:
  msrv:
    name: Rust 1.75 Feature Boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check library, CLI, and integration tests
        run: cargo check --all-targets --all-features

  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install nightly fuzz toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install evidence tools
        run: pip install 'jsonschema[format]==4.25.1'

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install specification tools and modules
        run: |
          npm install --global '@agent-ix/quire-cli@0.31.0' '@agent-ix/quoin@0.22.5'
          quoin module ensure-defaults

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-fuzz

      - name: Complete local gate
        env:
          TL_PARSE_TOOL_PROFILE: ${{ inputs.tool_profile }}
        run: make ci

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny policy
        run: cargo deny check licenses sources
