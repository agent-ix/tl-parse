name: CI

# Manual dispatch only, deliberately. There is no push or pull_request trigger:
# local `make ci` is the iteration gate, and a hosted run is dispatched once for
# a finalized revision so parallel pull-request work does not generate repeated
# billable runs. The `tool_profile` input is gone with `tools.lock`, which this
# migration removed along with the rest of the local evidence machinery.
on:
  workflow_dispatch:

jobs:
  msrv:
    name: Rust 1.98.1 Feature Boundary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check library, CLI, and integration tests
        run: cargo check --locked --all-targets --all-features

  rust:
    name: Rust Checks
    runs-on: ubuntu-24.04
    steps:
      # Full history: the assurance chain names an exact revision, and a shallow
      # checkout cannot resolve one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install nightly fuzz toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Candidate v0.3.2 matrix pins; human acceptance and tag are release gates.
      - name: Install specification tools and modules
        run: |
          npm install --global '@agent-ix/quire-cli@0.33.0' '@agent-ix/quoin@0.24.1' '@agent-ix/ix-flow@0.2.3'
          quoin module ensure-defaults

      - name: Install Engineering Assurance native CLI and Quire module
        run: |
          cargo +1.98.1 install --git https://github.com/agent-ix/engineering-assurance --tag v0.3.2 --locked --bin engineering-assurance
          quoin module install 'github:agent-ix/engineering-assurance//engineering_assurance@v0.3.2'

      - name: Install cargo-deny and cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-fuzz

      - name: Complete local gate
        run: make ci

  licenses:
    name: License Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny policy
        run: cargo deny check licenses sources
