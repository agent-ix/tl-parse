[package]
name = "tl-parse"
version = "0.4.0"
edition = "2021"
rust-version = "1.98.1"
description = "Parsing, formatting, and diagnostics for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-parse"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[lib]
name = "tl_parse"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tl-syntax = { version = "=0.4.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "9607722f24ac1978b5e0e0ceeb0cb2a828e10177", features = ["serde"] }

[dev-dependencies]
command-group = "=5.0.1"
criterion = { version = "=0.5.1", default-features = false }
proptest = "=1.5.0"
tempfile = "=3.10.1"

[[bench]]
name = "parser_roundtrip"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
