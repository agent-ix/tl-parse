[package]
name = "tl-parse"
version = "0.3.0"
edition = "2021"
rust-version = "1.98.1"
description = "Parsing, formatting, and diagnostics for Mission-time Linear Temporal Logic."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/tl-parse"

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "tl_parse"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tl-syntax = { version = "=0.3.0", git = "https://github.com/agent-ix/tl-syntax.git", rev = "5ced12e22917c56bb2ebd161a3e519cddf7a668a", features = ["serde"] }

[dev-dependencies]
command-group = "=5.0.1"
proptest = "=1.5.0"
serde_yaml_ng = "0.10"
tempfile = "=3.10.1"

[profile.release]
lto = "thin"
codegen-units = 1
